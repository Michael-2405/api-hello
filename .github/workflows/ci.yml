name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  image:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Deploy over SSH
      env:
        EC2_HOST: ${{ secrets.EC2_HOST }}
        EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
      run: |
        set -euo pipefail
        IMAGE="ghcr.io/michael-2405/api-hello:sha-${GITHUB_SHA::7}"

        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

        ssh -i ~/.ssh/deploy_key "ubuntu@$EC2_HOST" bash -s -- "$IMAGE" <<'EOF'
        set -euo pipefail
        IMAGE="$1"
        docker pull "$IMAGE"
        docker rm -f api-hello || true
        docker run -d --name api-hello --restart unless-stopped -p 8080:8080 "$IMAGE"
        EOF

    - name: Health check
      env:
        EC2_HOST: ${{ secrets.EC2_HOST }}
      run: |
        for i in 1 2 3 4 5; do
          curl -fsS "http://$EC2_HOST:8080/health" && exit 0
          sleep 3
        done
        echo "health check failed"
        exit 1
        ~
